<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Font Family</title>
  <style>
    #helvetica {
      font-family: Helvetica, sans-serif;
    }

    #arial {
      font-family: Arial, sans-serif;
    }

    #serif {
      font-family: serif;
    }

    #sans-serif {
      font-family: sans-serif;
    }

    #cursive {
      font-family: cursive;
    }

    #monospace {
      font-family: monospace;
    }

    #fantasy {
      font-family: fantasy;
    }
    h1{
      font-family: "Ole", cursive;
      font-weight: 400;
      font-style: normal;
    }
    .test-case{
      font-family: "Lora", serif;
      font-optical-sizing: auto;
      font-weight: bold;
      font-style: normal;
    }
    .playwrite{
      font-family: "Playwrite GB J", cursive;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Ole&display=swap" rel="stylesheet">
</head>

<body>
<h1>Fonts dot google dot com</h1>
<p class="test-case">Whereas disregard and contempt for human rights have resulted</p>
<p class="playwrite">Playwrite GB J: CSS class for a variable style</p>
  <p id="helvetica">Helvetica</p>
  <p id="arial">Arial</p>
  <p id="serif">Serif</p>
  <p id="sans-serif">Sans Serif</p>
  <p id="cursive">Cursive</p>
  <p id="monospace">Monospace</p>
  <p id="fantasy">Fantasy</p>

</body>

</html>
