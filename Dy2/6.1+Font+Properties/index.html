<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Properties</title>
  <style>
    body {
      background-color: cornflowerblue;
      color: white;
      font-size: 18px;
    }

    /* Don't change the CSS above, add Your CSS below */
    html {
      font-size: 30px;
    }
    .color-coral{
      color: coral;
    }
    .Font-size{
      font-size: 2rem;
    }
    .Font-weight{
      font-weight: 900;
    }
    .Font-family{
      font-family: "Playwrite GB J", cursive;
      font-optical-sizing: auto;
      font-weight: 400;
      font-style: normal;
    }
    .Text-align{
    text-align: right;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Playwrite+GB+J:ital,wght@0,100..400;1,100..400&display=swap" rel="stylesheet">
</head>

<body>
  <h1>Important CSS Properties</h1>
  <p class="color-coral">Color</p>
  <p class="Font-size">Font Size</p>
  <p class="Font-weight">Font Weight</p>
  <p class="Font-family">Font Family</p>
  <p class="Text-align">Text Align</p>

</html>
